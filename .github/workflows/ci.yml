name: CI

on:
  push:
    branches:
      - main
  pull_request:

# 같은 ref에서 새 실행이 시작되면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate

  test-unit:
    name: Vitest (React ${{ matrix.react-major-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react-major-version: ['18', '19']
    env:
      REACT_MAJOR_VERSION: ${{ matrix.react-major-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  test-bundle:
    name: Check Bundle Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run bundle-size:check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  test-browser:
    name: Cypress
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # 의존성 설치 스크립트가 꺼져 있어 Cypress 바이너리를 따로 설치한다.
      - run: pnpm cypress install
      - run: node browser-test-harness.js browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-failures
          path: |
            cypress/videos
            cypress/screenshots
          if-no-files-found: ignore

  test-a11y:
    name: Accessibility Audit
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: node browser-test-harness.js accessibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: test-reports/lighthouse
          if-no-files-found: ignore
