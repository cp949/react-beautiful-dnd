name: Release

# v* 태그 push에서 @cp949/react-beautiful-dnd를 npm에 배포한다.
# npm 토큰 없이 trusted publishing(OIDC)으로 인증한다. npmjs.com 패키지 설정의 trusted publisher에
# 저장소 cp949/react-beautiful-dnd와 이 파일명(release.yml)이 등록돼 있어야 한다. 파일명을 바꾸면 등록도 바꾼다.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # main 포함 여부를 확인하려면 전체 이력이 필요하다.
          fetch-depth: 0

      # pnpm 버전은 package.json의 packageManager 필드를 따른다.
      - uses: pnpm/action-setup@v4

      # trusted publishing은 npm CLI 11.5.1 이상이 필요하다. Node 24에 번들된 npm을 쓴다.
      # registry-url은 지정하지 않는다. 지정하면 토큰 자리표시자가 담긴 .npmrc가 만들어져 OIDC 인증을 가린다.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # main에 병합되지 않은 커밋의 태그는 배포하지 않는다.
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # 태그와 package.json 버전이 다르면 배포하지 않는다.
      - run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      - run: pnpm validate
      - run: pnpm test

      # prepublishOnly가 가드(scripts/publish-guard.mjs) 확인 후 pnpm build로 dist를 만든다.
      - run: npm publish --provenance --access public
