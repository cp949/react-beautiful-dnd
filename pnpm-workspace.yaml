# pnpm 11+는 package.json의 pnpm 필드를 읽지 않는다. 설정은 이 파일에 둔다.
# 빌드 스크립트 실행 여부. v10에서도 승인 목록이 없어 실행되지 않았으므로 동일하게 거부한다.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  cypress: false
  esbuild: false
  unrs-resolver: false

# overrides는 의존성 취약점 대응용이다. 항목을 지우면 취약 버전이 설치될 수 있다.
overrides:
  '@conventional-changelog/git-client@<2.0.0': '>=2.0.0 <3.0.0'
  'tmp@<=0.2.3': '>=0.2.4 <1.0.0'
  'undici@<6.23.0': '>=6.23.0 <7.0.0'
